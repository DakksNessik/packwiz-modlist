name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: packwizml

jobs:
  linux-musl:
    name: Build Linux (musl)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Alpine)
        run: apk add --no-cache cargo rust

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-musl"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-musl
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-musl
          if-no-files-found: error

  linux-glibc:
    name: Build Linux (glibc)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: apk add --no-cache docker-cli

      - name: Build in glibc container (Docker)
        run: |
          docker run --rm --volumes-from "$HOSTNAME" \
            -w "$PWD" \
            rust:1-bookworm \
            sh -c "cargo build --release"

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-gnu"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-gnu
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-gnu
          if-no-files-found: error

  windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (release)
        shell: bash
        run: |
          # The MSVC Build Tools (VS_MSBUILD/VC/Tools/MSVC) must be present and on
          # PATH for this to work. Prepend a toolchain's Hostx64/x64 dir so the
          # real MSVC link.exe shadows Git's GNU link. Note: paths contain spaces,
          # so always keep them quoted and never pipe through space-splitting tools.
          export VS_MSBUILD="C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools"
          if [ -d "$VS_MSBUILD/VC/Tools/MSVC" ]; then
            # Use a bash glob array to handle spaces in the path correctly.
            shopt -s nullglob
            dirs=( "$VS_MSBUILD"/VC/Tools/MSVC/*/ )
            if [ ${#dirs[@]} -gt 0 ]; then
              # Take the last glob match as the toolchain dir, strip trailing slash.
              LATEST="${dirs[${#dirs[@]}-1]}"
              LATEST="${LATEST%/}"
            else
              echo "ERROR: no MSVC toolchain dirs found under $VS_MSBUILD/VC/Tools/MSVC"
              exit 1
            fi
            MSVC_BIN="$LATEST/bin/Hostx64/x64"
            echo "MSVC linker dir: $MSVC_BIN"
            if [ ! -f "$MSVC_BIN/link.exe" ]; then
              echo "ERROR: link.exe not found at $MSVC_BIN"
              ls "$LATEST/bin/" 2>/dev/null
              exit 1
            fi
            export PATH="$MSVC_BIN:$USERPROFILE/.cargo/bin:$PATH"
            echo "Using MSVC link.exe: $(command -v link.exe)"
          else
            echo "ERROR: MSVC Build Tools not found at $VS_MSBUILD"
            echo "The runner image does not contain the VS C++ build tools."
            exit 1
          fi
          cargo build --release

      - name: Rename binary
        shell: bash
        run: |
          mv "target/release/${{ env.BINARY_NAME }}.exe" "target/${{ env.BINARY_NAME }}-windows-x86_64.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: target/${{ env.BINARY_NAME }}-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: runner-latest
    needs: [linux-musl, linux-glibc, windows]
    # Only create a release on tag pushes; manual dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release and upload assets (Gitea API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk add --no-cache jq curl
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag $TAG"
          resp=$(curl -sS -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}")
          id=$(echo "$resp" | jq -r '.id')
          echo "Release id: $id"
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name"
            curl -sS -X POST "$API/$id/assets?name=$name" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" >/dev/null
          done
