name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: packwizml

jobs:
  linux-musl:
    name: Build Linux (musl)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Alpine)
        run: apk add --no-cache cargo rust

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-musl"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-musl
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-musl
          if-no-files-found: error

  linux-glibc:
    name: Build Linux (glibc)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + cross deps (Alpine)
        run: apk add --no-cache cargo rust openssl-dev pkgconfig docker-cli curl

      - name: Install rustup (required by cross)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross build (glibc)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cross build --release --target x86_64-unknown-linux-gnu

      - name: Rename binary
        run: |
          mv "target/x86_64-unknown-linux-gnu/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-gnu"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-gnu
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-gnu
          if-no-files-found: error

  windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: |
          mv "target/release/${{ env.BINARY_NAME }}.exe" "target/${{ env.BINARY_NAME }}-windows-x86_64.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: target/${{ env.BINARY_NAME }}-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: runner-latest
    needs: [linux-musl, linux-glibc, windows]
    # Only create a release on tag pushes; manual dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release and upload assets (Gitea API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk add --no-cache jq curl
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag $TAG"
          resp=$(curl -sS -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}")
          id=$(echo "$resp" | jq -r '.id')
          echo "Release id: $id"
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name"
            curl -sS -X POST "$API/$id/assets?name=$name" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" >/dev/null
          done
