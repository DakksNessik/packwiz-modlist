name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: packwizml

jobs:
  linux-musl:
    name: Build Linux (musl)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Alpine)
        run: apk add --no-cache cargo rust

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-musl"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-musl
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-musl
          if-no-files-found: error

  linux-glibc:
    name: Build Linux (glibc)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: apk add --no-cache docker-cli

      - name: Build in glibc container (Docker)
        run: |
          docker run --rm --volumes-from "$HOSTNAME" \
            -w "$PWD" \
            rust:1-bookworm \
            sh -c "cargo build --release"

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-gnu"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-gnu
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-gnu
          if-no-files-found: error

  windows:
    name: Build Windows (GNU)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Ensure MinGW-w64 linker is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "=== Detecting toolchain availability ==="
          if (Get-Command gcc -ErrorAction SilentlyContinue) { Write-Output "gcc found: $(gcc --version | Select-Object -First 1)" }
          else { Write-Output "gcc NOT found" }
          if (Get-Command winget -ErrorAction SilentlyContinue) { Write-Output "winget available" } else { Write-Output "winget NOT available" }
          if (Get-Command choco -ErrorAction SilentlyContinue) { Write-Output "choco available" } else { Write-Output "choco NOT available" }

          # Try to provision MinGW-w64 via whichever package manager exists
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              Write-Output "=== Installing MinGW-w64 via choco ==="
              choco install mingw -y --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Output "=== Installing MSYS2 via winget ==="
              winget install --id MSYS2.MSYS2 --accept-source-agreements --accept-package-agreements
            } else {
              Write-Output "ERROR: no gcc, choco, or winget available"
              exit 1
            }
          }

          # The choco mingw package installs to C:\ProgramData\mingw64\mingw64\bin.
          # It updates the system PATH, but this process' PATH is stale, so add it
          # explicitly and export it for subsequent steps via GITHUB_ENV.
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (Test-Path "$mingwBin\gcc.exe") {
            Write-Output "MinGW gcc found at $mingwBin"
            $env:Path = "$mingwBin;$env:Path"
            Write-Output "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } elseif (Get-Command gcc -ErrorAction SilentlyContinue) {
            $gccDir = Split-Path (Get-Command gcc).Source
            Write-Output "MinGW gcc found on PATH at $gccDir"
            Write-Output "MINGW_BIN=$gccDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Output "ERROR: gcc not found after install attempt"
            exit 1
          }

      - name: Build (release)
        shell: bash
        run: |
          if [ -n "$MINGW_BIN" ]; then export PATH="$MINGW_BIN:$PATH"; fi
          which gcc && gcc --version | head -1
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Rename binary
        shell: bash
        run: |
          mv "target/x86_64-pc-windows-gnu/release/${{ env.BINARY_NAME }}.exe" "target/${{ env.BINARY_NAME }}-windows-x86_64.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: target/${{ env.BINARY_NAME }}-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: runner-latest
    needs: [linux-musl, linux-glibc, windows]
    # Only create a release on tag pushes; manual dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release and upload assets (Gitea API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk add --no-cache jq curl
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag $TAG"
          resp=$(curl -sS -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}")
          id=$(echo "$resp" | jq -r '.id')
          echo "Release id: $id"
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name"
            curl -sS -X POST "$API/$id/assets?name=$name" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" >/dev/null
          done
