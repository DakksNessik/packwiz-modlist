name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: packwizml

jobs:
  linux-musl:
    name: Build Linux (musl)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (Alpine)
        run: apk add --no-cache cargo rust

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-musl"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-musl
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-musl
          if-no-files-found: error

  linux-glibc:
    name: Build Linux (glibc)
    runs-on: runner-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: apk add --no-cache docker-cli

      - name: Build in glibc container (Docker)
        run: |
          docker run --rm --volumes-from "$HOSTNAME" \
            -w "$PWD" \
            rust:1-bookworm \
            sh -c "cargo build --release"

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" "target/${{ env.BINARY_NAME }}-linux-x86_64-gnu"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-gnu
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-gnu
          if-no-files-found: error

  windows:
    name: Build Windows (GNU)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure MinGW-w64 linker + GNU toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. Ensure MinGW-w64 gcc is installed (choco has it from prior runs)
          if (-not (Test-Path "C:\ProgramData\mingw64\mingw64\bin\gcc.exe")) {
            choco install mingw -y --no-progress
          }
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path "$mingwBin\gcc.exe")) { Write-Error "MinGW gcc missing at $mingwBin" }
          Write-Output "MinGW gcc OK at $mingwBin"

          # 2. Install the GNU target via rustup, and pin it as default so cargo
          #    does NOT fall back to the broken MSVC host toolchain.
          rustup target add x86_64-pc-windows-gnu
          rustup override set stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

          # 3. Export PATH (mingw bin first) and target vars for later steps
          $env:Path = "$mingwBin;$env:Path"
          Write-Output "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Output "=== verification ==="
          rustup show active-toolchain
          gcc --version | Select-Object -First 1

      - name: Build (release)
        shell: bash
        run: |
          export PATH="$MINGW_BIN:$PATH"
          # Ensure cargo uses the GNU host toolchain and gcc as the linker
          export CARGO_BUILD_TARGET="x86_64-pc-windows-gnu"
          export RUSTFLAGS="-C linker=$MINGW_BIN/gcc.exe"
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Rename binary
        shell: bash
        run: |
          mv "target/x86_64-pc-windows-gnu/release/${{ env.BINARY_NAME }}.exe" "target/${{ env.BINARY_NAME }}-windows-x86_64.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: target/${{ env.BINARY_NAME }}-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: runner-latest
    needs: [linux-musl, linux-glibc, windows]
    # Only create a release on tag pushes; manual dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release and upload assets (Gitea API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk add --no-cache jq curl
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag $TAG"
          resp=$(curl -sS -X POST "$API" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}")
          id=$(echo "$resp" | jq -r '.id')
          echo "Release id: $id"
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name"
            curl -sS -X POST "$API/$id/assets?name=$name" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" >/dev/null
          done
