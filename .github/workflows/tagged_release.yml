name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BINARY_NAME: packwizml
  CARGO_TERM_COLOR: always

jobs:
  linux-musl:
    name: Build Linux (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-gcc
        # `ring` (rustls crypto backend) compiles C/asm via the `cc` crate and
        # needs musl-gcc to target x86_64-unknown-linux-musl. Not preinstalled
        # on ubuntu-latest, so install it explicitly.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (release)
        # Fully static binary (statically linked musl libc).
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Rename binary
        run: |
          mv "target/x86_64-unknown-linux-musl/release/${{ env.BINARY_NAME }}" \
             "target/${{ env.BINARY_NAME }}-linux-x86_64-musl"

      - name: Upload binary
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-musl
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-musl
          if-no-files-found: error

  linux-glibc:
    name: Build Linux (glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build (release)
        # Default host target on ubuntu-latest is x86_64-unknown-linux-gnu.
        run: cargo build --release

      - name: Rename binary
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" \
             "target/${{ env.BINARY_NAME }}-linux-x86_64-gnu"

      - name: Upload binary
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BINARY_NAME }}-linux-x86_64-gnu
          path: target/${{ env.BINARY_NAME }}-linux-x86_64-gnu
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build (release)
        run: cargo build --release

      - name: Rename binary
        # macos-latest is arm64 (Apple Silicon); name the artifact accordingly.
        run: |
          mv "target/release/${{ env.BINARY_NAME }}" \
             "target/${{ env.BINARY_NAME }}-macos-aarch64"

      - name: Upload binary
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BINARY_NAME }}-macos-aarch64
          path: target/${{ env.BINARY_NAME }}-macos-aarch64
          if-no-files-found: error

  windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build (release)
        # windows-latest ships the VS Build Tools and rustup defaults to the
        # x86_64-pc-windows-msvc toolchain, so no PATH/MSVC linker fiddling
        # is needed here.
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: |
          mv "target/release/${{ env.BINARY_NAME }}.exe" \
             "target/${{ env.BINARY_NAME }}-windows-x86_64.exe"

      - name: Upload binary
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BINARY_NAME }}-windows-x86_64
          path: target/${{ env.BINARY_NAME }}-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux-musl, linux-glibc, macos, windows]
    # Only create a release on tag pushes; manual dispatch builds but does not release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
