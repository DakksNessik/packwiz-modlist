---
name: 🐛 Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can — it helps us reproduce and fix it faster.

        > **Note:** This repository is a **fork** of [Ricky12Awesome/packwiz-modlist](https://github.com/Ricky12Awesome/packwiz-modlist). If the bug is not specific to this fork's changes, consider also reporting it upstream.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm before submitting.
      options:
        - label: I have searched the existing issues and this is not a duplicate
          required: true
        - label: I am running the latest release (or a recent build from `main`)
          required: true
        - label: I have included a reproducible example or steps
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `packwizml --version`
      placeholder: "e.g. 1.5.4+hotfix.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform were you running on?
      options:
        - Linux (glibc)
        - Linux (musl)
        - macOS (Apple Silicon)
        - Windows
        - Other / not sure
    validations:
      required: true
  - type: input
    id: binary
    attributes:
      label: How are you running it?
      description: Binary from a release, `cargo install`, or built from source?
      placeholder: "e.g. downloaded packwizml-linux-x86_64-gnu from Releases"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally with the exact command(s) you ran.
      placeholder: |
        1. Run `packwizml --path mypack --json`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste any error output or logs here.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: curseforge
    attributes:
      label: CurseForge-related?
      description: Does the pack contain CurseForge mods? (helps triage)
      options:
        - label: Yes, my pack contains CurseForge mods
        - label: No, only Modrinth mods
